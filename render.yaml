# Render Blueprint - GTD Todo App
# Documentation: https://render.com/docs/blueprint-spec

services:
  # API Backend (PHP/Symfony)
  - type: web
    name: gtd-api-prod
    runtime: docker
    dockerfilePath: ./infra/docker/api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    branch: main
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gtd-db-prod
          property: connectionString
      - key: JWT_PASSPHRASE
        generateValue: true
      - key: CORS_ALLOW_ORIGIN
        value: https://gtd-web-prod.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: gtd-api-staging
    runtime: docker
    dockerfilePath: ./infra/docker/api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    branch: 001-gtd-todo-app
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gtd-db-staging
          property: connectionString
      - key: JWT_PASSPHRASE
        generateValue: true
      - key: CORS_ALLOW_ORIGIN
        value: https://gtd-web-staging.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true

  # Web Frontend (React/Vite)
  - type: web
    name: gtd-web-prod
    runtime: static
    buildCommand: npm ci --prefix web && npm run build --prefix web
    staticPublishPath: ./web/dist
    branch: main
    envVars:
      - key: VITE_API_URL
        value: https://gtd-api-prod.onrender.com/api/v1
      - key: VITE_APPLE_CLIENT_ID
        value: com.gtd.app
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  - type: web
    name: gtd-web-staging
    runtime: static
    buildCommand: npm ci --prefix web && npm run build --prefix web
    staticPublishPath: ./web/dist
    branch: 001-gtd-todo-app
    envVars:
      - key: VITE_API_URL
        value: https://gtd-api-staging.onrender.com/api/v1
      - key: VITE_APPLE_CLIENT_ID
        value: com.gtd.app.staging
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: gtd-db-prod
    databaseName: gtd_prod
    user: gtd_prod
    region: frankfurt
    plan: free
    ipAllowList: []

  - name: gtd-db-staging
    databaseName: gtd_staging
    user: gtd_staging
    region: frankfurt
    plan: free
    ipAllowList: []
