name: CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    needs: determine-environment

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gtd-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/gtd-api:${{ needs.determine-environment.outputs.environment }}
            ${{ secrets.DOCKER_USERNAME }}/gtd-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web Docker Image
    runs-on: ubuntu-latest
    needs: determine-environment

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gtd-web:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/gtd-web:${{ needs.determine-environment.outputs.environment }}
            ${{ secrets.DOCKER_USERNAME }}/gtd-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [determine-environment, build-api, build-web]
    if: needs.determine-environment.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.gtd-app.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          echo "API Image: ${{ secrets.DOCKER_USERNAME }}/gtd-api:${{ github.sha }}"
          echo "Web Image: ${{ secrets.DOCKER_USERNAME }}/gtd-web:${{ github.sha }}"
          # Add actual deployment commands here (SSH, kubectl, etc.)

      - name: Run database migrations
        run: |
          echo "📦 Running database migrations"
          # Add migration command here

      - name: Health check
        run: |
          echo "🏥 Running health checks"
          sleep 10
          # Add actual health check here
          # curl -f https://staging.gtd-app.example.com/api/health || exit 1

      - name: Run E2E tests
        run: |
          echo "🧪 Running E2E tests on staging"
          # Add E2E test command here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [determine-environment, build-api, build-web]
    if: needs.determine-environment.outputs.environment == 'production'
    environment:
      name: production
      url: https://gtd-app.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment"
          echo "API Image: ${{ secrets.DOCKER_USERNAME }}/gtd-api:${{ github.sha }}"
          echo "Web Image: ${{ secrets.DOCKER_USERNAME }}/gtd-web:${{ github.sha }}"
          # Add actual deployment commands here (SSH, kubectl, etc.)

      - name: Run database migrations
        run: |
          echo "📦 Running database migrations"
          # Add migration command here

      - name: Health check
        run: |
          echo "🏥 Running health checks"
          sleep 10
          # Add actual health check here
          # curl -f https://gtd-app.example.com/api/health || exit 1

      - name: Verify deployment
        run: |
          echo "✅ Deployment verified"

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure()

    steps:
      - name: Rollback deployment
        run: |
          echo "⚠️  Deployment failed - initiating rollback"
          # Add rollback commands here
          # This could revert to the previous Docker image tag
          # or redeploy the last known good version

      - name: Notify team
        run: |
          echo "📧 Notifying team of rollback"
          # Add notification logic here (Slack, email, etc.)
