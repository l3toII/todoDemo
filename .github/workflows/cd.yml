name: CD Pipeline

on:
  push:
    branches: [main, 001-gtd-todo-app]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      web-image: ${{ steps.meta-web.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Render)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/001-gtd-todo-app' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://gtd-web-staging.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Render Staging
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_API_STAGING: ${{ secrets.RENDER_SERVICE_ID_API_STAGING }}
        run: |
          echo "Triggering Render deployment for API staging..."
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID_API_STAGING" ]; then
            curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_API_STAGING}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": false}'
          else
            echo "Render API key or service ID not configured - Render will auto-deploy from branch"
          fi

      - name: Deploy Web to Render Staging
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_WEB_STAGING: ${{ secrets.RENDER_SERVICE_ID_WEB_STAGING }}
        run: |
          echo "Triggering Render deployment for Web staging..."
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID_WEB_STAGING" ]; then
            curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_WEB_STAGING}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": false}'
          else
            echo "Render API key or service ID not configured - Render will auto-deploy from branch"
          fi

      - name: Wait for deployment
        run: |
          echo "Waiting for Render deployment to complete..."
          sleep 60

      - name: Health check - API
        run: |
          echo "Performing health check on staging API..."
          for i in {1..5}; do
            if curl -sf https://gtd-api-staging.onrender.com/api/health; then
              echo "API health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "::warning::API health check failed after 5 attempts"
        continue-on-error: true

      - name: Health check - Web
        run: |
          echo "Performing health check on staging Web..."
          for i in {1..5}; do
            if curl -sf https://gtd-web-staging.onrender.com; then
              echo "Web health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "::warning::Web health check failed after 5 attempts"
        continue-on-error: true

      - name: Notify deployment
        if: success()
        run: |
          echo "Staging deployment successful"
          echo "API: https://gtd-api-staging.onrender.com"
          echo "Web: https://gtd-web-staging.onrender.com"

  deploy-production:
    name: Deploy to Production (Render)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://gtd-web-prod.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Render Production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_API_PROD: ${{ secrets.RENDER_SERVICE_ID_API_PROD }}
        run: |
          echo "Triggering Render deployment for API production..."
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID_API_PROD" ]; then
            curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_API_PROD}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": false}'
          else
            echo "Render API key or service ID not configured - Render will auto-deploy from branch"
          fi

      - name: Deploy Web to Render Production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_WEB_PROD: ${{ secrets.RENDER_SERVICE_ID_WEB_PROD }}
        run: |
          echo "Triggering Render deployment for Web production..."
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID_WEB_PROD" ]; then
            curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_WEB_PROD}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": false}'
          else
            echo "Render API key or service ID not configured - Render will auto-deploy from branch"
          fi

      - name: Wait for deployment
        run: |
          echo "Waiting for Render deployment to complete..."
          sleep 90

      - name: Health check - API
        run: |
          echo "Performing health check on production API..."
          for i in {1..5}; do
            if curl -sf https://gtd-api-prod.onrender.com/api/health; then
              echo "API health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "::error::Production API health check failed"
          exit 1

      - name: Health check - Web
        run: |
          echo "Performing health check on production Web..."
          for i in {1..5}; do
            if curl -sf https://gtd-web-prod.onrender.com; then
              echo "Web health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "::error::Production Web health check failed"
          exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "Production deployment successful"
          echo "API: https://gtd-api-prod.onrender.com"
          echo "Web: https://gtd-web-prod.onrender.com"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Deployment failed. Manual rollback may be required."
          echo "Visit Render dashboard to rollback: https://dashboard.render.com"
