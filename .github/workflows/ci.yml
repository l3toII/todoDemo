name: CI Pipeline

on:
  push:
    branches: [main, 001-gtd-todo-app]
  pull_request:
    branches: ['**']

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  api-lint:
    name: API - PHP Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, zip, gd, opcache, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict
        working-directory: ./api

      - name: Setup .env file
        run: |
          cp .env.example .env
          echo "APP_ENV=test" >> .env
          echo "APP_SECRET=test-secret-for-ci" >> .env
        working-directory: ./api

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: ./api

      - name: Run PHP-CS-Fixer (dry-run)
        run: |
          if [ -f "vendor/bin/php-cs-fixer" ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff --verbose
          else
            echo "PHP-CS-Fixer not installed, skipping..."
          fi
        working-directory: ./api
        continue-on-error: true

      - name: Run PHPStan
        run: |
          if [ -f "vendor/bin/phpstan" ]; then
            vendor/bin/phpstan analyse src --level=8 --no-progress
          else
            echo "PHPStan not installed, skipping..."
          fi
        working-directory: ./api
        continue-on-error: true

  api-tests:
    name: API - PHPUnit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gtd_test
          POSTGRES_USER: gtd_test
          POSTGRES_PASSWORD: gtd_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U gtd_test -d gtd_test" --health-interval=10s --health-timeout=5s --health-retries=5
        # Note: Doctrine adds '_test' suffix in test env, so we use 'gtd' in DATABASE_URL
        # which becomes 'gtd_test' after the suffix is applied

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, zip, gd, opcache, mbstring
          coverage: pcov

      - name: Setup .env file
        run: |
          cp .env.example .env
          cp .env.test.example .env.test
          echo "APP_ENV=test" >> .env
          echo "APP_SECRET=test-secret-for-ci" >> .env
          # Use 'gtd' as DB name - Doctrine adds '_test' suffix in test env -> 'gtd_test'
          echo "DATABASE_URL=pgsql://gtd_test:gtd_test@127.0.0.1:5432/gtd?serverVersion=16&charset=utf8" >> .env
          echo "DATABASE_URL=pgsql://gtd_test:gtd_test@127.0.0.1:5432/gtd?serverVersion=16&charset=utf8" >> .env.test
          echo "JWT_PASSPHRASE=test-jwt-passphrase-for-ci" >> .env
        working-directory: ./api

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -passout pass:test-jwt-passphrase-for-ci 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:test-jwt-passphrase-for-ci
        working-directory: ./api

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: ./api

      - name: Create database schema
        run: php bin/console doctrine:migrations:migrate --no-interaction
        working-directory: ./api
        env:
          APP_ENV: test

      - name: Run PHPUnit
        env:
          APP_ENV: test
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit --coverage-clover=coverage.xml
          else
            echo "PHPUnit not installed, skipping tests..."
          fi
        working-directory: ./api

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./api/coverage.xml
          flags: api
          name: api-coverage
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: api-coverage
          path: api/coverage.xml
          retention-days: 1

  api-security:
    name: API - Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, zip, gd, opcache, mbstring
          coverage: none

      - name: Security Check
        run: |
          composer audit || echo "Security vulnerabilities found in dependencies"
        working-directory: ./api
        continue-on-error: true

  web-lint:
    name: Web - Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Run ESLint
        run: |
          if npm run lint --if-present; then
            echo "ESLint passed"
          else
            echo "ESLint failed or not configured"
          fi
        working-directory: ./web
        continue-on-error: true

      - name: Run Prettier check
        run: |
          if npm run format:check --if-present; then
            echo "Prettier passed"
          else
            echo "Prettier check failed or not configured"
          fi
        working-directory: ./web
        continue-on-error: true

  web-tests:
    name: Web - Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Run Jest
        run: |
          if npm run test --if-present -- --coverage; then
            echo "Jest tests passed"
          else
            echo "Jest tests failed or not configured"
          fi
        working-directory: ./web
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./web/coverage/coverage-final.json
          flags: web
          name: web-coverage
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 1

  web-build:
    name: Web - Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Build
        run: npm run build
        working-directory: ./web
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_APPLE_CLIENT_ID: com.example.gtd

      - name: Check bundle size
        run: |
          if [ -d "dist" ]; then
            BUNDLE_SIZE=$(du -sb dist | cut -f1)
            echo "Bundle size: $BUNDLE_SIZE bytes"
            if [ $BUNDLE_SIZE -gt 204800 ]; then
              echo "::warning::Bundle size exceeds 200KB target"
            fi
          fi
        working-directory: ./web

  web-security:
    name: Web - Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "Security vulnerabilities found in dependencies"
        working-directory: ./web
        continue-on-error: true

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [api-tests, web-tests]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/001-gtd-todo-app'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, zip, gd, opcache, mbstring
          coverage: pcov

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install API dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts
        working-directory: ./api

      - name: Install Web dependencies
        run: npm ci
        working-directory: ./web

      - name: Download API coverage
        uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: api/
        continue-on-error: true

      - name: Download Web coverage
        uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=l3toII_todoDemo
            -Dsonar.organization=l3toii
            -Dsonar.sources=api/src,web/src
            -Dsonar.tests=api/tests,web/src
            -Dsonar.test.inclusions=**/*Test.php,**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx
            -Dsonar.php.coverage.reportPaths=api/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=web/coverage/lcov.info
            -Dsonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/build/**

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [api-lint, api-tests, api-security, web-lint, web-tests, web-build, web-security, sonarcloud]
    if: always()
    steps:
      - name: Check CI status
        run: |
          echo "CI Pipeline completed"
          echo "API Lint: ${{ needs.api-lint.result }}"
          echo "API Tests: ${{ needs.api-tests.result }}"
          echo "API Security: ${{ needs.api-security.result }}"
          echo "Web Lint: ${{ needs.web-lint.result }}"
          echo "Web Tests: ${{ needs.web-tests.result }}"
          echo "Web Build: ${{ needs.web-build.result }}"
          echo "Web Security: ${{ needs.web-security.result }}"
          echo "SonarCloud: ${{ needs.sonarcloud.result }}"
