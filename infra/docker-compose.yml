services:
  db:
    image: postgres:16-alpine
    container_name: gtd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gtd_app
      POSTGRES_USER: gtd
      POSTGRES_PASSWORD: gtd_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - gtd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtd -d gtd_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/api/Dockerfile
    container_name: gtd_api
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../api:/var/www/html
      - ./docker/api/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://gtd:gtd_dev@db:5432/gtd_app?serverVersion=16&charset=utf8
      - APP_ENV=dev
      - APP_SECRET=changeme_in_production
    networks:
      - gtd_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/docker/web/Dockerfile
    container_name: gtd_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_APPLE_CLIENT_ID=com.example.gtd
    networks:
      - gtd_network
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gtd_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gtd_network

volumes:
  db_data:
    driver: local

networks:
  gtd_network:
    driver: bridge
